; https://docs.platformio.org/page/projectconf.html

[env]
lib_deps =
    tanakamasayuki/EspUsbHost @ 2.7.9
    esp32async/ESPAsyncWebServer @ 3.12.0
    bblanchon/ArduinoJson @ 7.4.3
extra_scripts = scripts/release.py

[env:esp32-s3-devkitc1-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc1-n16r8
board_build.filesystem = littlefs
board_build.flash_mode = dio
; Enables /api/ota/upload and the Update page (needs ota_0, ota_1 and otadata
; partitions).
build_flags = -D OTA_ENABLED=1
; Device that `pio run -t ota` uploads to; OTA_HOST=<host> overrides it.
custom_ota_host = tinkesp32.local
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize, time
